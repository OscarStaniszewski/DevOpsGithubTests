name: Run tests # Nazwa workflowu

on: # eventy
  push:
  pull_request:

jobs:
  test: # job
    runs-on: ubuntu-latest
    needs: lint
    name: Run tests
    
    steps:
      - uses: actions/checkout@v5 # krok 1
        name: Checkout repo

      - uses: actions/setup-python@v5 # krok 2
        with:
          python-version: '3.11'
        name: Install python

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        name: Install dependencies

      - run: pytest -q --junitxml=reports/pytest-report.xml
        name: Run pytest

      - if: always()  
        uses: actions/upload-artifact@v5
        name: Upload artifact
        with:
          name: pytest-report
          path: reports/pytest-report.xml

      - name: Generate summary
        if: always()
        run: |
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Event: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY


  lint:
    runs-on: ubuntu-latest
    name: Lint ruff

    steps:
      - uses: actions/checkout@v5
        name: Checkout repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        name: Install python

      - run: pip install ruff
        name: Install ruff

      - run: ruff check .
        name: Run ruff check